<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LIFX</title>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 720px; margin: 0 auto; }
      h1 { margin-bottom: 4px; }
      h2 { font-size: 16px; margin: 24px 0 8px; color: #222; }
      .muted { color: #777; font-size: 13px; margin-bottom: 16px; line-height: 1.4; }
      button { cursor: pointer; padding: 6px 14px; border-radius: 6px; border: 1px solid #bbb; background: #fff; font-size: 13px; }
      button.primary { background: #00A9E0; color: #fff; border-color: #00A9E0; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .toolbar { margin-top: 12px; display: flex; gap: 8px; }
      input[type="password"], input[type="text"] { padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; width: 100%; box-sizing: border-box; }
      .status-line { margin-top: 10px; font-size: 13px; min-height: 18px; }
      .status-line.ok { color: #2a7d2a; }
      .status-line.err { color: #c33; }
      .status-line.wait { color: #888; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      fieldset label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
      a { color: #00A9E0; }
    </style>
  </head>
  <body>
    <h1>LIFX</h1>

    <h2>Cloud scenes</h2>
    <p class="muted">
      Paste a Personal Access Token from
      <a href="https://cloud.lifx.com/settings" target="_blank" rel="noopener">cloud.lifx.com/settings</a>.
      The LIFX scene picker on each bulb uses this token to list and run scenes you've saved in
      the LIFX mobile app &mdash; including Art Series, Music, Moods, and any custom scenes.
    </p>
    <fieldset>
      <label for="cloudToken">Personal access token</label>
      <input id="cloudToken" type="password" autocomplete="off" spellcheck="false" />
      <div class="toolbar">
        <button class="primary" id="saveToken">Save</button>
        <button id="testToken">Test</button>
        <button id="clearToken">Clear</button>
      </div>
      <div class="status-line" id="tokenStatus"></div>
    </fieldset>

    <script>
      function onHomeyReady(Homey) {
        var cloudTokenInput = document.getElementById('cloudToken');
        var saveTokenBtn = document.getElementById('saveToken');
        var testTokenBtn = document.getElementById('testToken');
        var clearTokenBtn = document.getElementById('clearToken');
        var tokenStatus = document.getElementById('tokenStatus');

        function setStatus(msg, kind) {
          tokenStatus.className = 'status-line ' + (kind || 'wait');
          tokenStatus.textContent = msg;
        }

        function currentToken() {
          return (cloudTokenInput.value || '').trim();
        }

        Homey.get('lifx.cloud_token', function (err, value) {
          if (value) {
            cloudTokenInput.value = value;
            setStatus('Token saved.', 'ok');
          } else {
            setStatus('No token configured — the Scene picker on each bulb will be empty.', 'wait');
          }
        });

        saveTokenBtn.addEventListener('click', function () {
          var token = currentToken();
          if (!token) { setStatus('Paste a token first.', 'err'); return; }
          saveTokenBtn.disabled = true;
          Homey.set('lifx.cloud_token', token, function (err) {
            saveTokenBtn.disabled = false;
            if (err) { setStatus('Save failed: ' + err, 'err'); return; }
            setStatus('Saved. Scenes will sync within a minute.', 'ok');
          });
        });

        testTokenBtn.addEventListener('click', function () {
          var token = currentToken();
          if (!token) { setStatus('Paste a token first.', 'err'); return; }
          testTokenBtn.disabled = true;
          setStatus('Contacting LIFX cloud...', 'wait');
          Homey.api('POST', '/test-token', { token: token }, function (err, result) {
            testTokenBtn.disabled = false;
            if (err) { setStatus('Test failed: ' + (err.message || err), 'err'); return; }
            if (result && result.ok) {
              setStatus('OK — ' + result.sceneCount + ' scene(s) available.', 'ok');
            } else {
              setStatus((result && result.error) || 'Token rejected by LIFX cloud.', 'err');
            }
          });
        });

        clearTokenBtn.addEventListener('click', function () {
          if (!confirm('Remove the LIFX cloud token?')) return;
          cloudTokenInput.value = '';
          Homey.set('lifx.cloud_token', '', function (err) {
            if (err) { setStatus('Clear failed: ' + err, 'err'); return; }
            setStatus('Token removed.', 'wait');
          });
        });

        Homey.ready();
      }
    </script>
  </body>
</html>
