<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tubeGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C7D4DD" />
      <stop offset="45%" stop-color="#F5F9FB" />
      <stop offset="100%" stop-color="#C7D4DD" />
    </linearGradient>
    <linearGradient id="tubeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A9E0" stop-opacity="0" />
      <stop offset="50%" stop-color="#00A9E0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00A9E0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tubeCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA5AC" />
      <stop offset="100%" stop-color="#5C6770" />
    </linearGradient>
    <radialGradient id="tubeBackglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00A9E0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00A9E0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <rect x="40" y="20" width="176" height="216" fill="url(#tubeBackglow)" />

  <!-- Top cap -->
  <rect
    x="88" y="18" width="80" height="20" rx="4"
    fill="url(#tubeCap)" stroke="#2B3A43" stroke-width="2"
  />

  <!-- Bottom cap -->
  <rect
    x="88" y="218" width="80" height="20" rx="4"
    fill="url(#tubeCap)" stroke="#2B3A43" stroke-width="2"
  />

  <!-- Tube body -->
  <rect
    x="94" y="38" width="68" height="180" rx="4"
    fill="url(#tubeGlass)" stroke="#2B3A43" stroke-width="2"
  />

  <!-- Inner LED glow -->
  <rect x="102" y="48" width="52" height="160" rx="4" fill="url(#tubeGlow)" />

  <!-- Vertical zone separators (hints at multi-tile matrix) -->
  <line x1="128" y1="50" x2="128" y2="206" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" />

  <!-- Specular highlight -->
  <rect x="104" y="48" width="6" height="160" rx="3" fill="#FFFFFF" fill-opacity="0.35" />
</svg>
