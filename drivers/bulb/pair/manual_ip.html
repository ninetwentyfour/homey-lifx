<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title">Enter bulb IP address</h1>
      <p class="homey-subtitle">
        Reserve the IP in your DHCP server so it doesn't change. The bulb must be reachable over
        UDP 56700 from Homey's network.
      </p>
    </header>

    <fieldset class="homey-form-fieldset">
      <div class="homey-form-group">
        <label class="homey-form-label" for="ipInput">IP address</label>
        <input
          id="ipInput"
          class="homey-form-input"
          type="text"
          placeholder="192.168.3.42"
          autocomplete="off"
        />
      </div>
      <div id="status" style="margin-top: 12px; color: #888"></div>
    </fieldset>

    <div class="homey-button-group" style="margin-top: 16px">
      <button class="homey-button-primary-full" id="addBtn">Test and add</button>
    </div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();

        const ipInput = document.getElementById('ipInput');
        const addBtn = document.getElementById('addBtn');
        const status = document.getElementById('status');

        addBtn.addEventListener('click', async () => {
          const ip = ipInput.value.trim();
          if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
            status.style.color = '#c33';
            status.textContent = "That doesn't look like a valid IPv4 address.";
            return;
          }
          status.style.color = '#888';
          status.textContent = 'Contacting bulb...';
          addBtn.disabled = true;
          try {
            const device = await Homey.emit('manual_identify', { ip });
            status.style.color = '#2a2';
            status.textContent = 'Found ' + device.name + '. Adding to Homey...';
            await Homey.addDevice(device);
            Homey.done();
          } catch (err) {
            status.style.color = '#c33';
            status.textContent = err && err.message ? err.message : String(err);
            addBtn.disabled = false;
          }
        });

        ipInput.focus();
      }
    </script>
  </body>
</html>
