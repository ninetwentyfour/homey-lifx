<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 20px;
        color: #222;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p.sub {
        color: #777;
        font-size: 14px;
        margin: 0 0 20px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 16px;
        border: 1px solid #bbb;
        border-radius: 8px;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        background: #00a9e0;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        min-height: 18px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Enter bulb IP address</h1>
    <p class="sub">
      Reserve the IP in your DHCP server so it doesn't change. The bulb must be reachable over UDP
      56700 from Homey's network.
    </p>

    <label for="ipInput">IP address</label>
    <input
      id="ipInput"
      type="text"
      placeholder="192.168.3.42"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="addBtn">Test and add</button>
    <div id="status"></div>

    <script type="text/javascript">
      var ready = false;

      function onHomeyReady(Homey) {
        if (ready) return;
        ready = true;

        var ipInput = document.getElementById('ipInput');
        var addBtn = document.getElementById('addBtn');
        var statusEl = document.getElementById('status');

        function setStatus(msg, color) {
          statusEl.textContent = msg;
          statusEl.style.color = color || '#888';
        }

        addBtn.addEventListener('click', function () {
          var ip = (ipInput.value || '').trim();
          if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
            setStatus("That doesn't look like a valid IPv4 address.", '#c33');
            return;
          }
          setStatus('Contacting bulb...', '#888');
          addBtn.disabled = true;
          Homey.emit('manual_identify', { ip: ip }, function (err, device) {
            if (err || !device) {
              setStatus((err && (err.message || err)) || 'No response from bulb.', '#c33');
              addBtn.disabled = false;
              return;
            }
            setStatus('Found ' + device.name + '. Adding...', '#2a7d2a');
            Homey.addDevice(device, function (err2) {
              if (err2) {
                setStatus('Add failed: ' + (err2.message || err2), '#c33');
                addBtn.disabled = false;
                return;
              }
              Homey.done();
            });
          });
        });

        ipInput.focus();
        Homey.ready();
      }

      // Fallback: invoke manually if auto-call never happens
      setTimeout(function () {
        if (!ready && typeof Homey !== 'undefined' && Homey) {
          try {
            onHomeyReady(Homey);
          } catch (_e) {
            /* ignore */
          }
        }
      }, 1500);
    </script>
  </body>
</html>
