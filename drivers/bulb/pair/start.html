<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title">Add a LIFX bulb</h1>
      <p class="homey-subtitle">
        Newer firmware is auto-detected over mDNS. Older bulbs need their IP entered manually.
      </p>
    </header>

    <div class="homey-button-group" style="display: flex; flex-direction: column; gap: 10px;">
      <button class="homey-button-primary-full" id="autoBtn">
        Discover automatically (mDNS)
      </button>
      <button class="homey-button-secondary-full" id="manualBtn">
        I know my bulb's IP address
      </button>
    </div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();
        document.getElementById('autoBtn').addEventListener('click', () => {
          Homey.showView('list_devices');
        });
        document.getElementById('manualBtn').addEventListener('click', () => {
          Homey.showView('manual_ip');
        });
      }
    </script>
  </body>
</html>
